<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-image: url('https://images.unsplash.com/photo-1716307043003-dbe6a5cc496e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Ym94aW5nJTIwYmFnfGVufDB8fDB8fHww); background-size: cover; background-color: #0d6efd;">

    <div class="container my-5">

        <div class="row justify-content-center">
            <div class="col-lg-10 text-center bg-white rounded-pill p-2 mb-4">
                <p class="display-6 fw-bold">Beginner's Guide to boxing</p>
            </div>
        </div>

        <div class="row justify-content-center">

            <div class="col-lg-3 bg-white p-3 m-2 rounded">
                <p class="fw-bold bg-warning p-2">Basic Rules</p>
                <ul>
                    <li>no below the belt blows</li>
                    <li>must wear required gear</li>
                    <li>no wrestling</li>
                    <li>3 mins per round</li>
                </ul>
            </div>

            <div class="col-lg-3 bg-white p-3 m-2 rounded">
                <p class="fw-bold bg-warning p-2">Boxing Equipment</p>
                <ul>
                    <li>Gloves</li>
                    <li>Head Gear</li>
                    <li>Groin Guard</li>
                    <li>Mouth Guard</li>
                </ul>
            </div>

            <div class="col-lg-3 bg-white p-3 m-2 rounded">
                <p class="fw-bold bg-warning p-2">Basic punches</p>
                <ul>
                    <li>jab</li>
                    <li>straight</li>
                    <li>hook</li>
                    <li>uppercut</li>
                    <li>overhand</li>
                </ul>
            </div>

        </div>

    </div>
</body>
</html>
